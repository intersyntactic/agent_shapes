name: is_agent_shapes
description: >-
  Shapes for an intersyntactic agent's conversation: AgentName, a node about
  the agent's id whose value is the name it chose; UserSaid, what a person
  said; and ReplyText, the agent's reply to it.
version: 0.1.0
repository: https://github.com/intersyntactic/agent_shapes

environment:
  sdk: ^3.13.0

dependencies:
  is_shapes: ^0.3.0

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.33.0
